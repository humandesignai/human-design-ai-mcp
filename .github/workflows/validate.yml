name: Validate plugin distribution

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run package
      - name: Verify reproducible plugin archive
        run: |
          cp dist/human-design-ai-plugin.zip /tmp/human-design-ai-plugin-first.zip
          npm run package
          cmp /tmp/human-design-ai-plugin-first.zip dist/human-design-ai-plugin.zip
